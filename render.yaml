# render.yaml — RAVOR (frontend + backend)
# Bu dosya Render için iki web servisi tanımlar: frontend (Next.js) ve backend (Express).
# Not: Render UI sürümlerinde küçük farklılıklar olabilir; render.yaml yüklense bile UI'da bazı gizli/secret env'leri manuel girmeniz gerekebilir.

services:
  - type: web
    name: RAVOR-frontend
    env: node
    branch: cleanup/cleanup-2025-10-28
    region: oregon
    plan: free
    rootDirectory: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    env:
      NEXT_PUBLIC_API_URL: "https://ravor-backend.onrender.com/api" # deploy sonrası gerçek backend URL ile güncelle
      NODE_ENV: "production"

  - type: web
    name: RAVOR-backend
    env: node
    branch: cleanup/cleanup-2025-10-28
    region: oregon
    plan: free
    rootDirectory: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    env:
      JWT_SECRET: "__GENERATE_IN_RENDER_UI__" # Bu değeri Render UI'da gizli olarak oluşturup gir
      BASE_URL: "https://ravor-backend.onrender.com" # deploy sonrası Render'ın verdiği backend URL ile değiştir
      NODE_ENV: "production"

# Uyarılar:
# - "free" plan ve free instance'larda Persistent Disk olmayabilir. Eğer SQLite ve uploads'ı aynı yerde tutmak istiyorsan
#   Backend servisi için Render üzerinde Persistent Disk açman gerekir (ücretli olabilir).
# - Alternatif olarak S3 + managed Postgres kullanmak daha güvenlidir. Bu dosyada S3/Postgres entegrasyonu otomatik değil;
#   Secrets (AWS, DB) Render UI üzerinden girilmelidir.
# - Eğer Render UI render.yaml'ı otomatik algılamazsa, yukarıdaki değerleri kullanarak "New Web Service" ekranına manuel gir.
